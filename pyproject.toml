[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pumpkin"
version = "0.1.0"
description = "find secrets in javascript"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "pydantic",
    "pydantic-settings",
    "requests",
    "termcolor",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "requests-mock",
    "ruff",
]

[project.scripts]
pumpkin = "pumpkin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pumpkin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.pyright]
venvPath = "."
venv = "venv"
include = ["src", "tests"]
